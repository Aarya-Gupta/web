# Jobs
- company: "MIDAS: Multimodal Digital Media Analysis Lab IIITD"
  position: Computer Vision Intern
  duration: Aug, 2024 &mdash; Present
  # url: https://github.com/Aarya-Gupta/Autonomous-Driving-Systems
  # <li>This project enhances traffic management and safety by analyzing live traffic videos using ML, DL, and LLMs and gathering crucial information to detect accidents in real-time.</li>
  # <li>A fast and efficient pipeline is being built to handle the video data, ensuring timely and reliable accident detection.</li>
  # <li>Analyzed MORTH data to identify accident conditions in India and scraping accident videos to curate a dataset based on government-defined factors.</li>
    
  summary: >
    Key Responsibilities and Achievements Include:
    <ul class="resume-item-list">
    <li><strong>Dataset Curation & Preprocessing:</strong> Reorganized and standardized a multimodal traffic-accident dataset of 5,691 videos (3,912 train, 1,054 val, 725 test) across CCTV, dashcam, and drone sources—downsampled to 15 fps, resized to 224×224, and structured into overlapping 16-frame clips to enable robust model training and evaluation.</li>
    <li><strong>Dynamic Vehicle Tracking Pipeline:</strong> Engineered a hybrid YOLO/DINO + SAM2 segmentation pipeline that dynamically detects and adds newly introduced vehicles into the tracker, propagating masks across subsequent frames via a custom “SAM-2 Alpha” propagation step—validated over thousands of frames for continuous, robust tracking in live traffic streams.</li>
    <li><strong>Real-Time Stream Processing & LLM Verification:</strong> Developed a near real-time pipeline processing incoming video in 100-frame (10 s at 10 fps) windows—masking vehicles via CV+SAM2, flagging critical frames by bounding-box overlap, and querying a fine-tuned multimodal LLM—achieving &gt; 90 % video-level accident classification accuracy.</li>
    <li><strong>Advanced Fusion & Temporal Modeling (Evaluation):</strong> Integrated contrastive-trained attention fusion across RGB, segmentation, and depth tokens with a Transformer+GRU temporal head, delivering strong frame-level Average Precision and low Mean Time to Anticipation (mTTA) across benchmarks such as DAD, CCD, A3D, and DADA-2000.</li>
    </ul>

- company: "NETSEC: Network Security Lab IIITD"
